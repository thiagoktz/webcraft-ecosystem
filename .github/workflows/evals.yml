name: "Avaliação Automática do Ecossistema (EVALS)"

on:
  pull_request:
    paths:
      - "agents/**"
      - "shared-skills/**"
      - "orchestrator/**"
      - "evals/**"
      - "ecosystem.json"
      - "agent-registry.json"
  push:
    branches:
      - main
    paths:
      - "agents/**"
      - "shared-skills/**"
      - "orchestrator/**"
      - "evals/**"
      - "ecosystem.json"
      - "agent-registry.json"

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Validação estrutural do ecossistema
  # ──────────────────────────────────────────
  validate-structure:
    name: "Validar estrutura do ecossistema"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivos obrigatórios na raiz
        run: |
          echo "🔍 Verificando arquivos obrigatórios..."

          REQUIRED_FILES=(
            "README.md"
            "HANDOFF.md"
            "ACTIVATE.md"
            "ecosystem.json"
            "agent-registry.json"
            "orchestrator/system-prompt.md"
            "evals/EVALS.md"
            "evals/pipelines/pipelines.md"
            "evals/shared-skills/shared-skills.md"
          )

          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Arquivo obrigatório não encontrado: $file"
              MISSING=1
            else
              echo "✅ $file"
            fi
          done

          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "💥 Estrutura inválida."
            exit 1
          fi

      - name: Validar sintaxe dos JSONs
        run: |
          echo "🔍 Validando ecosystem.json e agent-registry.json..."
          node -e "JSON.parse(require('fs').readFileSync('ecosystem.json'))" || exit 1
          node -e "JSON.parse(require('fs').readFileSync('agent-registry.json'))" || exit 1
          echo "✅ JSONs válidos"

      - name: Validar coerência registry ↔ filesystem
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const reg = JSON.parse(fs.readFileSync('agent-registry.json'));
          let errors = 0;

          for (const agent of reg.agents) {
            if (!fs.existsSync(agent.system_prompt)) {
              console.log(`❌ ${agent.id}: system_prompt '${agent.system_prompt}' não existe`);
              errors++;
            }
            for (const skill of (agent.skills || [])) {
              if (!fs.existsSync(skill)) {
                console.log(`❌ ${agent.id}: skill '${skill}' não existe`);
                errors++;
              }
            }
          }

          // Pipelines: cada agent citado deve existir
          const agentIds = new Set(reg.agents.map(a => a.id));
          for (const [pname, seq] of Object.entries(reg.pipelines)) {
            for (const a of seq) {
              if (!agentIds.has(a)) {
                console.log(`❌ Pipeline '${pname}' cita '${a}' inexistente`);
                errors++;
              }
            }
          }

          if (errors === 0) {
            console.log('✅ Coerência total entre registry e filesystem');
          } else {
            console.log(`💥 ${errors} erro(s) de coerência`);
            process.exit(1);
          }
          SCRIPT

      - name: Validar coerência ecosystem.json ↔ registry
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const eco = JSON.parse(fs.readFileSync('ecosystem.json'));
          const reg = JSON.parse(fs.readFileSync('agent-registry.json'));
          let errors = 0;

          // Mesma quantidade de agentes
          const ecoIds = new Set(eco.agents.list.map(a => a.id));
          const regIds = new Set(reg.agents.map(a => a.id));
          for (const id of regIds) if (!ecoIds.has(id)) { console.log(`❌ '${id}' no registry mas não no ecosystem.json`); errors++; }
          for (const id of ecoIds) if (!regIds.has(id)) { console.log(`❌ '${id}' no ecosystem.json mas não no registry`); errors++; }

          // Mesmos pipelines
          const ecoP = Object.keys(eco.pipelines).sort();
          const regP = Object.keys(reg.pipelines).sort();
          if (JSON.stringify(ecoP) !== JSON.stringify(regP)) {
            console.log(`❌ Pipelines divergentes: eco=${ecoP} reg=${regP}`);
            errors++;
          }

          if (errors === 0) console.log('✅ ecosystem.json e registry estão alinhados');
          else process.exit(1);
          SCRIPT

  # ──────────────────────────────────────────
  # JOB 2: Verificar EVALS de cada agente
  # ──────────────────────────────────────────
  validate-evals:
    name: "Validar EVALS de cada agente"
    runs-on: ubuntu-latest
    needs: validate-structure

    steps:
      - uses: actions/checkout@v4
      - name: Cada agente tem arquivo de evals?
        run: |
          node <<'SCRIPT'
          const fs = require('fs');
          const reg = JSON.parse(fs.readFileSync('agent-registry.json'));
          let missing = 0;
          for (const a of reg.agents) {
            const direct = `evals/agents/${a.id}.md`;
            const shared = 'evals/agents/feedback-memory-agents.md';
            if (fs.existsSync(direct)) {
              console.log(`✅ ${a.id} → ${direct}`);
            } else if (['memory-agent','feedback-agent'].includes(a.id) && fs.existsSync(shared)) {
              console.log(`✅ ${a.id} → ${shared}`);
            } else {
              console.log(`❌ ${a.id}: sem arquivo de evals`);
              missing++;
            }
          }
          if (missing > 0) process.exit(1);
          SCRIPT

  # ──────────────────────────────────────────
  # JOB 3: Comentário no PR
  # ──────────────────────────────────────────
  comment-pr:
    name: "Comentar resultado no PR"
    runs-on: ubuntu-latest
    needs: [validate-structure, validate-evals]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Comentar no PR
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ needs.validate-structure.result }}' === 'success'
                   && '${{ needs.validate-evals.result }}' === 'success';
            const status = ok ? '✅ APROVADO' : '❌ REPROVADO';
            const body = `## 🧪 Validação do Ecossistema\n\n**Status:** ${status}\n\n- validate-structure: ${{ needs.validate-structure.result }}\n- validate-evals: ${{ needs.validate-evals.result }}\n\n> Veja os logs do workflow para detalhes.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
